<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
  <title>ToDo - DS Edition</title>

  <!-- PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ToDo">

  <!-- ホーム画面アイコン：アザラシ（🦭） -->
  <link rel="apple-touch-icon" href="https://fav.farm/🦭">

  <!-- Google Fonts: ドットフォント (Press Start 2P) + 通常フォント (Plus Jakarta Sans / Noto Sans JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --pixel-bg: #dbe4d0;
      --window-bg: #ffffff;
      --pixel-line: #3d4f58;
      --pixel-shadow: #3d4f58;
      --pixel-text: #2c383f;
      --pixel-gray: #94a3b8;
      --pixel-dark-gray: #546671;
      --accent-orange: #ff5400;
      --btn-green: #22c55e;
      --line-border: 2px solid var(--pixel-line);

      /* フォント定義 */
      --font-pixel: 'Press Start 2P', monospace;
      --font-text: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }

    body {
      font-family: var(--font-pixel);
      margin: 0;
      padding: 32px 12px 24px 12px;
      color: var(--pixel-text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      background-color: var(--pixel-bg);
      letter-spacing: 0;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* DSウィンドウ風コンテナ */
    .app-container {
      width: 100%;
      max-width: 420px;
      background: var(--window-bg);
      border: 3px solid var(--pixel-line);
      box-shadow: 4px 4px 0px var(--pixel-shadow);
      padding: 14px 12px 18px 12px;
      position: relative;
      z-index: 1;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: var(--line-border);
      position: relative;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    h1 {
      font-family: var(--font-pixel);
      font-size: 1.15rem;
      margin: 0;
      color: var(--pixel-text);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-action-btn {
      background: #f1f5f9;
      border: var(--line-border);
      box-shadow: 2px 2px 0px var(--pixel-shadow);
      cursor: pointer;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--pixel-text);
      width: 28px;
      height: 28px;
      transition: transform 0.05s ease;
    }
    .icon-action-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .icon-action-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--pixel-shadow);
    }

    /* キャラクター画像ボタン */
    .char-avatar-btn {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      position: relative;
    }
    .char-avatar-btn:active {
      transform: scale(0.92);
    }

    .char-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      background: #ffffff;
      display: block;
    }

    /* レトロRPG風フキダシ */
    .speech-bubble {
      position: absolute;
      top: 36px;
      left: 12px;
      background: #ffffff;
      border: 2px solid var(--pixel-line);
      box-shadow: 3px 3px 0px var(--pixel-shadow);
      padding: 6px 10px;
      font-family: var(--font-text);
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--pixel-text);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-4px) scale(0.95);
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 100;
    }
    .speech-bubble::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 36px;
      border-width: 0 5px 6px 5px;
      border-style: solid;
      border-color: transparent transparent var(--pixel-line) transparent;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      top: -3px;
      left: 37px;
      border-width: 0 4px 4px 4px;
      border-style: solid;
      border-color: transparent transparent #ffffff transparent;
    }
    .speech-bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .del-category-btn {
      background: #fff;
      border: var(--line-border);
      box-shadow: 2px 2px 0px var(--pixel-shadow);
      color: #b91c1c;
      font-family: var(--font-pixel);
      font-size: 0.58rem;
      cursor: pointer;
      padding: 5px 6px;
      line-height: 1;
    }
    .del-category-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--pixel-shadow);
    }

    /* Tabs */
    .tabs-wrapper {
      display: flex;
      gap: 6px;
      align-items: center;
      overflow-x: auto;
      padding-bottom: 5px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }

    .tab-btn {
      height: 30px;
      padding: 0 12px;
      background: #f1f5f9;
      border: var(--line-border);
      box-shadow: 2px 2px 0px var(--pixel-shadow);
      font-family: var(--font-text);
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--pixel-dark-gray);
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s ease;
    }

    .tab-btn.active {
      background: var(--accent-orange);
      color: #ffffff;
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--pixel-shadow);
    }

    /* カテゴリ追加ボタン（タブと同じ高さ・配置に修正） */
    .add-tab-btn {
      height: 30px;
      width: 32px;
      padding: 0;
      background: #ffffff;
      border: var(--line-border);
      box-shadow: 2px 2px 0px var(--pixel-shadow);
      font-family: var(--font-pixel);
      font-size: 0.85rem;
      line-height: 1;
      color: var(--pixel-dark-gray);
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.05s ease;
    }
    .add-tab-btn:active {
      background: #f8fafc;
      color: var(--pixel-text);
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--pixel-shadow);
    }

    /* Status Panel */
    .status-panel {
      background: #f8fafc;
      border: var(--line-border);
      padding: 8px 10px;
      margin-top: 8px;
      margin-bottom: 12px;
    }
    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    /* ドット絵スター付きストリークバッジ */
    .streak-badge {
      font-family: var(--font-pixel);
      font-size: 0.62rem;
      line-height: 1;
      color: var(--accent-orange);
      background: #fff;
      padding: 4px 6px;
      border: 1px solid var(--pixel-line);
      box-shadow: 1px 1px 0px var(--pixel-shadow);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .streak-badge svg {
      width: 10px;
      height: 10px;
      fill: var(--accent-orange);
      flex-shrink: 0;
    }
    .streak-badge.zero {
      color: var(--pixel-gray);
      border-color: #cbd5e1;
      box-shadow: none;
    }
    .streak-badge.zero svg {
      fill: var(--pixel-gray);
    }

    .pixel-pop {
      animation: pixelPop 0.3s steps(3, end);
    }
    @keyframes pixelPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.35) translateY(-1px); }
      100% { transform: scale(1); }
    }

    .progress-text {
      font-family: var(--font-pixel);
      font-size: 0.60rem;
      color: var(--pixel-dark-gray);
    }
    .progress-bar-track {
      width: 100%;
      height: 7px;
      background: #e2e8f0;
      border: 1px solid var(--pixel-line);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--btn-green);
      transition: width 0.25s steps(10, end);
    }

    /* 追加フォーム */
    .add-form {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .add-input {
      flex: 1;
      padding: 6px 10px;
      border: var(--line-border);
      background: #ffffff;
      font-family: var(--font-text);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--pixel-text);
      outline: none;
    }
    .add-input::placeholder {
      font-family: var(--font-pixel);
      font-size: 0.68rem;
      color: #94a3b8;
    }
    .add-input:focus {
      background: #fffbeb;
      border-color: var(--accent-orange);
    }

    .add-btn {
      width: 33px;
      height: 33px;
      padding: 0;
      background: var(--btn-green);
      color: #ffffff;
      border: var(--line-border);
      box-shadow: 2px 2px 0px var(--pixel-shadow);
      font-family: var(--font-pixel);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .add-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--pixel-shadow);
    }

    /* Item List */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    .item-row {
      display: flex;
      align-items: center;
      padding: 7px 8px;
      background: #ffffff;
      border: var(--line-border);
      box-shadow: 2px 2px 0px rgba(61, 79, 88, 0.12);
      user-select: none;
      transition: transform 0.08s ease, background-color 0.15s ease;
    }
    .item-row:active {
      transform: translate(1px, 1px);
    }

    .item-row.just-checked {
      animation: checkFlash 0.2s steps(2, end);
    }
    @keyframes checkFlash {
      0% { background: #ffedd5; }
      50% { background: #ffffff; }
      100% { background: #f8fafc; }
    }

    .item-row.dragging {
      opacity: 0.45;
      background: #fffbeb;
      border-style: dashed;
    }

    .drag-handle {
      cursor: grab;
      color: #cbd5e1;
      padding: 0 4px 0 0;
      display: flex;
      align-items: center;
      font-size: 0.95rem;
      touch-action: none;
    }

    .item-row.checked {
      background: #f8fafc;
      border-color: #cbd5e1;
      box-shadow: none;
      opacity: 0.65;
    }

    .item-text {
      flex: 1;
      font-family: var(--font-text);
      font-size: 0.94rem;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .item-row.checked .item-text {
      text-decoration: line-through;
      color: var(--pixel-gray);
    }

    .item-content {
      display: flex;
      align-items: center;
      flex-grow: 1;
      cursor: pointer;
      margin-left: 2px;
      min-width: 0;
    }

    .inline-edit-input {
      flex: 1;
      font-family: var(--font-text);
      font-size: 0.94rem;
      font-weight: 700;
      padding: 2px 4px;
      border: 2px solid var(--accent-orange);
      outline: none;
      background: #ffffff;
    }

    /* GB風ピクセルチェックボックス */
    .checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--pixel-line);
      margin-right: 8px;
      background: #ffffff;
      cursor: pointer;
      display: grid;
      place-content: center;
      flex-shrink: 0;
      pointer-events: none;
      box-shadow: 1px 1px 0px rgba(61, 79, 88, 0.2);
    }
    .checkbox:checked {
      background: var(--accent-orange);
      border-color: var(--pixel-line);
    }
    /* GBスプライト風 8-bit ピクセルチェックマーク */
    .checkbox:checked::after {
      content: "";
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10' shape-rendering='crispEdges'><rect x='7' y='1' width='2' height='2'/><rect x='6' y='3' width='2' height='2'/><rect x='5' y='5' width='2' height='2'/><rect x='4' y='7' width='2' height='2'/><rect x='2' y='5' width='2' height='2'/><rect x='1' y='4' width='2' height='2'/></svg>");
      mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10' shape-rendering='crispEdges'><rect x='7' y='1' width='2' height='2'/><rect x='6' y='3' width='2' height='2'/><rect x='5' y='5' width='2' height='2'/><rect x='4' y='7' width='2' height='2'/><rect x='2' y='5' width='2' height='2'/><rect x='1' y='4' width='2' height='2'/></svg>");
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      display: block;
    }

    .del-item-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
    }
    .del-item-btn:hover { color: #dc2626; }

    /* Completed Accordion */
    .completed-section {
      margin-top: 8px;
      margin-bottom: 6px;
    }
    .completed-toggle-btn {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--pixel-dark-gray);
      font-family: var(--font-pixel);
      font-size: 0.62rem;
      cursor: pointer;
      line-height: 1.2;
    }
    .completed-toggle-btn:active {
      background: #e2e8f0;
    }
    .completed-items-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }
    .completed-section:not(.open) .completed-items-container {
      display: none;
    }

    .empty-hint {
      text-align: center;
      color: var(--pixel-dark-gray);
      font-family: var(--font-pixel);
      font-size: 0.64rem;
      line-height: 1.4;
      padding: 18px 0;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      background: #ffffff;
      border: 3px solid var(--pixel-line);
      box-shadow: 4px 4px 0px var(--pixel-shadow);
      padding: 16px;
      width: 100%;
      max-width: 330px;
    }
    .modal-card h3 {
      font-family: var(--font-pixel);
      margin: 0 0 10px 0;
      font-size: 0.85rem;
      border-bottom: var(--line-border);
      padding-bottom: 6px;
      line-height: 1.2;
    }
    .modal-card p {
      font-family: var(--font-pixel);
      font-size: 0.58rem;
      color: var(--pixel-dark-gray);
      margin: 0 0 12px 0;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-label {
      font-family: var(--font-pixel);
      font-size: 0.58rem;
      color: var(--pixel-dark-gray);
    }
    .form-text-input {
      width: 100%;
      padding: 6px 8px;
      border: var(--line-border);
      font-family: var(--font-text);
      font-size: 0.88rem;
      font-weight: 700;
      outline: none;
      color: var(--pixel-text);
      background: #fff;
    }
    .form-text-input:focus {
      border-color: var(--accent-orange);
      background: #fffbeb;
    }
    .time-input-group {
      display: flex;
      margin-bottom: 14px;
    }
    .time-input-group input[type="time"] {
      width: 100%;
      padding: 6px 8px;
      border: var(--line-border);
      font-family: var(--font-pixel);
      font-size: 0.85rem;
      outline: none;
      color: var(--pixel-text);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-btn {
      padding: 6px 12px;
      font-family: var(--font-pixel);
      font-size: 0.62rem;
      line-height: 1;
      border: var(--line-border);
      box-shadow: 2px 2px 0px var(--pixel-shadow);
      cursor: pointer;
    }
    .modal-btn.primary {
      background: var(--accent-orange);
      color: white;
    }
    .modal-btn.secondary {
      background: #f1f5f9;
      color: var(--pixel-text);
    }
    .modal-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--pixel-shadow);
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">
    <div class="header">
      <div class="title-group">
        <h1>ToDo</h1>
        <button class="char-avatar-btn" id="char-btn" title="Tap to talk / Long press to change">
          <img id="char-img" class="char-img" src="" alt="Character">
        </button>
        <div id="speech-bubble" class="speech-bubble">タップしてね！</div>
        <input type="file" id="char-file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
      </div>
      <div class="header-actions">
        <button class="icon-action-btn" onclick="openNotifyModal()" title="Notification settings">
          <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
            <rect x="7" y="1" width="2" height="2" />
            <rect x="6" y="3" width="4" height="2" />
            <rect x="5" y="5" width="6" height="4" />
            <rect x="3" y="9" width="10" height="2" />
            <rect x="2" y="11" width="12" height="2" />
            <rect x="7" y="13" width="2" height="2" />
          </svg>
        </button>
        <button class="icon-action-btn" onclick="openResetModal()" title="Auto-reset settings">
          <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
            <rect x="6" y="0" width="4" height="2" />
            <rect x="4" y="2" width="8" height="2" />
            <rect x="2" y="4" width="2" height="8" />
            <rect x="12" y="4" width="2" height="8" />
            <rect x="4" y="12" width="8" height="2" />
            <rect x="3" y="3" width="2" height="2" />
            <rect x="11" y="3" width="2" height="2" />
            <rect x="3" y="11" width="2" height="2" />
            <rect x="11" y="11" width="2" height="2" />
            <rect x="7" y="5" width="2" height="4" />
            <rect x="7" y="7" width="4" height="2" />
          </svg>
        </button>
        <button class="del-category-btn" onclick="deleteCurrentCategory()">DEL TAB</button>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="tabs-wrapper">
      <div id="tabs-container" style="display: flex; gap: 6px;"></div>
      <button class="add-tab-btn" onclick="addNewCategory()">+</button>
    </div>

    <!-- Status Panel -->
    <div class="status-panel">
      <div class="status-header">
        <div id="streak-display" class="streak-badge">
          <svg viewBox="0 0 9 9" shape-rendering="crispEdges">
            <rect x="4" y="0" width="1" height="1"/>
            <rect x="4" y="1" width="1" height="1"/>
            <rect x="1" y="2" width="7" height="1"/>
            <rect x="2" y="3" width="5" height="1"/>
            <rect x="3" y="4" width="3" height="1"/>
            <rect x="2" y="5" width="5" height="1"/>
            <rect x="1" y="6" width="3" height="1"/>
            <rect x="5" y="6" width="3" height="1"/>
            <rect x="0" y="7" width="2" height="1"/>
            <rect x="7" y="7" width="2" height="1"/>
          </svg>
          <span id="streak-text">0 DAYS</span>
        </div>
        <span id="progress-text" class="progress-text">0 / 0 CLEAR</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- 追加フォーム -->
    <form class="add-form" onsubmit="addItem(event)">
      <input type="text" id="new-item-input" class="add-input" placeholder="NEW TASK..." required>
      <button type="submit" class="add-btn" title="Add item">+</button>
    </form>

    <!-- Active Items List -->
    <div class="item-list" id="item-list"></div>

    <!-- Completed Items Accordion -->
    <div class="completed-section open" id="completed-section" style="display: none;">
      <button class="completed-toggle-btn" onclick="toggleCompletedSection()">
        <span id="completed-title-count">CLEARED (0)</span>
        <span class="toggle-arrow" id="toggle-arrow">▲</span>
      </button>
      <div class="completed-items-container" id="completed-items-container"></div>
    </div>
  </div>

  <!-- Auto Reset Settings Modal -->
  <div class="modal-backdrop" id="reset-modal">
    <div class="modal-card">
      <h3>AUTO-RESET</h3>
      <p>SET DAILY AUTO-RESET TIME FOR COMPLETED ITEMS.</p>
      <div class="time-input-group">
        <input type="time" id="reset-time-input" value="04:00">
      </div>
      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="closeResetModal()">CANCEL</button>
        <button class="modal-btn primary" onclick="saveResetSettings()">SET</button>
      </div>
    </div>
  </div>

  <!-- Notification Settings Modal -->
  <div class="modal-backdrop" id="notify-modal">
    <div class="modal-card">
      <h3>NOTIFY SETUP</h3>
      <p>SET DAILY TIME & CUSTOM MESSAGE.<br>TAG: {streak} = CURRENT STREAK</p>
      
      <div class="form-group">
        <label class="form-label" style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="notify-enabled" style="accent-color: var(--accent-orange); width: 15px; height: 15px;">
          ENABLE NOTIFICATION
        </label>
      </div>

      <div class="form-group">
        <label class="form-label">TIME</label>
        <div class="time-input-group" style="margin-bottom: 0;">
          <input type="time" id="notify-time-input" value="20:00">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">TITLE</label>
        <input type="text" id="notify-title-input" class="form-text-input" placeholder="Routine Reminder">
      </div>

      <div class="form-group">
        <label class="form-label">MESSAGE</label>
        <input type="text" id="notify-body-input" class="form-text-input" placeholder="🔥 {streak} days streak! Time to clear your list.">
      </div>

      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="closeNotifyModal()">CANCEL</button>
        <button class="modal-btn primary" onclick="saveNotifySettings()">SAVE</button>
      </div>
    </div>
  </div>

  <script>
    /* Web Audio API - レトロゲーム音源 */
    const SoundEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      },
      playTone(freq, type, duration, startTime = 0) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + startTime);
        
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime + startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + startTime + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + startTime);
        osc.stop(this.ctx.currentTime + startTime + duration);
      },
      playCheck() {
        this.init();
        this.playTone(523.25, 'square', 0.08, 0);
        this.playTone(659.25, 'square', 0.12, 0.07);
      },
      playUncheck() {
        this.init();
        this.playTone(440, 'square', 0.07, 0);
        this.playTone(349.23, 'square', 0.10, 0.06);
      },
      playTalk() {
        this.init();
        this.playTone(880, 'sine', 0.05, 0);
        this.playTone(1174.66, 'sine', 0.06, 0.04);
      },
      playAllClear() {
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          this.playTone(freq, 'triangle', 0.18, idx * 0.1);
        });
      }
    };

    function triggerHaptic(pattern = 15) {
      if ("vibrate" in navigator) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    const defaultAvatarSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect width="16" height="16" fill="%23ffffff"/><rect x="4" y="3" width="8" height="9" fill="%23ffffff"/><rect x="3" y="5" width="10" height="6" fill="%23ffffff"/><rect x="5" y="6" width="1" height="2" fill="%233d4f58"/><rect x="10" y="6" width="1" height="2" fill="%233d4f58"/><rect x="7" y="8" width="2" height="1" fill="%233d4f58"/><rect x="4" y="8" width="1" height="1" fill="%23f472b6"/><rect x="11" y="8" width="1" height="1" fill="%23f472b6"/><rect x="2" y="9" width="2" height="2" fill="%23cbd5e1"/><rect x="12" y="9" width="2" height="2" fill="%23cbd5e1"/></svg>`;

    let userAvatar = localStorage.getItem("todoAppAvatar") || defaultAvatarSvg;
    document.getElementById("char-img").src = userAvatar;

    function openImagePicker() {
      const choice = confirm("Change character sprite?");
      if (choice) {
        document.getElementById("char-file-input").click();
      }
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        userAvatar = event.target.result;
        document.getElementById("char-img").src = userAvatar;
        localStorage.setItem("todoAppAvatar", userAvatar);
      };
      reader.readAsDataURL(file);
    }

    let bubbleTimer = null;
    function triggerCharacterReaction() {
      const bubble = document.getElementById("speech-bubble");
      const currentItems = data[currentCategory] || [];
      const totalCount = currentItems.length;
      const completedCount = currentItems.filter(i => i.checked).length;
      const remainingCount = totalCount - completedCount;

      let dialoguePool = [];

      if (totalCount === 0) {
        dialoguePool = [
          "あたらしい タスクを ついかしてね！",
          "きょうは なにをする？",
          "準備万端！いつでもOK！"
        ];
      } else if (remainingCount === 0) {
        dialoguePool = [
          "かんぺき！えらすぎる！",
          "きょうのタスクは オールクリア！",
          "きょうも いい1日に なったね！"
        ];
      } else if (remainingCount <= 2) {
        dialoguePool = [
          `あと${remainingCount}コ！ラストスパート！`,
          "もうひとふんばり だ！",
          "ゴールが みえてきたよ！",
          "その調子！いっしょにクリアしよう！"
        ];
      } else {
        dialoguePool = [
          "ひとつずつ かたづけていこう！",
          "まずは ひとつクリアしてみる？",
          "マイペースで だいじょうぶ！",
          "水分補給も わすれずにね！",
          "焦らず いっぽずつ いこう！"
        ];
      }

      const chosenDialogue = dialoguePool[Math.floor(Math.random() * dialoguePool.length)];
      bubble.textContent = chosenDialogue;
      
      bubble.classList.remove("show");
      void bubble.offsetWidth;
      bubble.classList.add("show");

      SoundEngine.playTalk();
      triggerHaptic(20);

      if (bubbleTimer) clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => {
        bubble.classList.remove("show");
      }, 3000);
    }

    const charBtn = document.getElementById("char-btn");
    let charLongPressTimer = null;
    let isLongPress = false;

    charBtn.addEventListener("touchstart", (e) => {
      isLongPress = false;
      charLongPressTimer = setTimeout(() => {
        isLongPress = true;
        triggerHaptic([30, 40]);
        openImagePicker();
      }, 650);
    }, { passive: true });

    charBtn.addEventListener("touchend", (e) => {
      clearTimeout(charLongPressTimer);
      if (!isLongPress) {
        triggerCharacterReaction();
      }
    });

    charBtn.addEventListener("touchmove", () => {
      clearTimeout(charLongPressTimer);
    });

    charBtn.addEventListener("click", (e) => {
      if (!('ontouchstart' in window)) {
        triggerCharacterReaction();
      }
    });

    charBtn.addEventListener("dblclick", () => {
      openImagePicker();
    });

    const defaultData = {
      "General": [
        { text: "Keys & Passcode", checked: false },
        { text: "Phone & Transit Card", checked: false },
        { text: "Wallet", checked: false },
        { text: "Lock Doors & Windows", checked: false }
      ],
      "Travel": [
        { text: "Power Bank", checked: false },
        { text: "Earphones", checked: false },
        { text: "Umbrella", checked: false }
      ]
    };

    let data = JSON.parse(localStorage.getItem("routineAppDataEn")) || defaultData;
    let categoryStreaks = JSON.parse(localStorage.getItem("todoCategoryStreaks")) || {};
    let categories = Object.keys(data);
    let currentCategory = categories[0] || "";
    let wasAllCompleted = false;

    let autoResetTime = localStorage.getItem("todoAutoResetTime") || "04:00";
    let lastResetDate = localStorage.getItem("todoLastResetDate") || "";

    function getLogicalDateString() {
      const now = new Date();
      const [rHour, rMin] = autoResetTime.split(":").map(Number);
      const threshold = new Date(now.getFullYear(), now.getMonth(), now.getDate(), rHour, rMin, 0, 0);
      if (now >= threshold) {
        return threshold.toISOString().slice(0, 10);
      } else {
        const yesterday = new Date(threshold.getTime() - 24 * 60 * 60 * 1000);
        return yesterday.toISOString().slice(0, 10);
      }
    }

    function checkDailyAutoReset() {
      const targetResetDate = getLogicalDateString();

      if (lastResetDate !== targetResetDate) {
        Object.keys(data).forEach(cat => {
          data[cat] = data[cat].map(item => ({ ...item, checked: false }));
        });
        lastResetDate = targetResetDate;
        localStorage.setItem("todoLastResetDate", lastResetDate);
        saveData();
        render();
      }
    }

    let notifyConfig = JSON.parse(localStorage.getItem("todoNotifyConfig")) || {
      enabled: false,
      time: "20:00",
      title: "Routine Reminder",
      body: "🔥 {streak} days streak! Time to clear your list.",
      lastNotifiedDate: ""
    };

    function openNotifyModal() {
      document.getElementById("notify-enabled").checked = notifyConfig.enabled;
      document.getElementById("notify-time-input").value = notifyConfig.time;
      document.getElementById("notify-title-input").value = notifyConfig.title;
      document.getElementById("notify-body-input").value = notifyConfig.body;
      document.getElementById("notify-modal").classList.add("open");
    }

    function closeNotifyModal() {
      document.getElementById("notify-modal").classList.remove("open");
    }

    async function saveNotifySettings() {
      const isEnabled = document.getElementById("notify-enabled").checked;
      if (isEnabled && "Notification" in window) {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") {
          alert("Notification permission denied in browser settings.");
          document.getElementById("notify-enabled").checked = false;
          return;
        }
      }

      notifyConfig.enabled = isEnabled;
      notifyConfig.time = document.getElementById("notify-time-input").value || "20:00";
      notifyConfig.title = document.getElementById("notify-title-input").value.trim() || "Routine Reminder";
      notifyConfig.body = document.getElementById("notify-body-input").value.trim() || "Time to check your list!";
      localStorage.setItem("todoNotifyConfig", JSON.stringify(notifyConfig));
      closeNotifyModal();
    }

    function checkDailyNotification() {
      if (!notifyConfig.enabled || !("Notification" in window) || Notification.permission !== "granted") {
        return;
      }

      const now = new Date();
      const todayDateStr = now.toISOString().slice(0, 10);
      const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      if (currentTimeStr >= notifyConfig.time && notifyConfig.lastNotifiedDate !== todayDateStr) {
        const streakCount = categoryStreaks[currentCategory] ? categoryStreaks[currentCategory].current : 0;
        const resolvedBody = notifyConfig.body.replace(/{streak}/g, streakCount);

        try {
          new Notification(notifyConfig.title, {
            body: resolvedBody,
            icon: "https://fav.farm/🦭"
          });
          notifyConfig.lastNotifiedDate = todayDateStr;
          localStorage.setItem("todoNotifyConfig", JSON.stringify(notifyConfig));
        } catch (e) {
          console.error("Notification failed", e);
        }
      }
    }

    function updateStreakOnAllCompleted(categoryName) {
      if (!categoryStreaks[categoryName]) {
        categoryStreaks[categoryName] = { current: 0, lastCompletedDate: "" };
      }

      const streakData = categoryStreaks[categoryName];
      const todayStr = getLogicalDateString();

      if (streakData.lastCompletedDate === todayStr) {
        return;
      }

      const today = new Date(todayStr);
      const yesterday = new Date(today.getTime() - 24 * 60 * 60 * 1000);
      const yesterdayStr = yesterday.toISOString().slice(0, 10);

      if (streakData.lastCompletedDate === yesterdayStr) {
        streakData.current += 1;
      } else {
        streakData.current = 1;
      }

      streakData.lastCompletedDate = todayStr;
      localStorage.setItem("todoCategoryStreaks", JSON.stringify(categoryStreaks));
    }

    function openResetModal() {
      document.getElementById("reset-time-input").value = autoResetTime;
      document.getElementById("reset-modal").classList.add("open");
    }
    function closeResetModal() {
      document.getElementById("reset-modal").classList.remove("open");
    }
    function saveResetSettings() {
      const val = document.getElementById("reset-time-input").value;
      if (val) {
        autoResetTime = val;
        localStorage.setItem("todoAutoResetTime", autoResetTime);
        lastResetDate = "";
        checkDailyAutoReset();
      }
      closeResetModal();
    }

    function saveData() {
      localStorage.setItem("routineAppDataEn", JSON.stringify(data));
      localStorage.setItem("todoCategoryStreaks", JSON.stringify(categoryStreaks));
    }

    function toggleCompletedSection() {
      const sec = document.getElementById("completed-section");
      sec.classList.toggle("open");
      updateAccordionArrow();
    }

    function updateAccordionArrow() {
      const sec = document.getElementById("completed-section");
      const arrow = document.getElementById("toggle-arrow");
      if (arrow) {
        arrow.textContent = sec.classList.contains("open") ? "▲" : "▼";
      }
    }

    function render(highlightIndex = null) {
      categories = Object.keys(data);

      if (categories.length === 0) {
        data["General"] = [];
        categories = ["General"];
        currentCategory = "General";
      }

      if (!categories.includes(currentCategory)) {
        currentCategory = categories[0];
      }

      const tabsContainer = document.getElementById("tabs-container");
      tabsContainer.innerHTML = "";
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${cat === currentCategory ? "active" : ""}`;
        btn.textContent = cat;
        btn.onclick = () => {
          currentCategory = cat;
          wasAllCompleted = false;
          render();
        };
        tabsContainer.appendChild(btn);
      });

      const listContainer = document.getElementById("item-list");
      const completedContainer = document.getElementById("completed-items-container");
      const completedSection = document.getElementById("completed-section");
      
      listContainer.innerHTML = "";
      completedContainer.innerHTML = "";
      
      const currentItems = data[currentCategory] || [];
      const totalCount = currentItems.length;
      let completedCount = 0;

      currentItems.forEach((item, index) => {
        if (item.checked) completedCount++;

        const row = document.createElement("div");
        row.className = `item-row ${item.checked ? "checked" : ""} ${highlightIndex === index ? "just-checked" : ""}`;
        row.dataset.index = index;

        const handleHtml = item.checked ? "" : `<div class="drag-handle">⋮</div>`;
        
        row.innerHTML = `
          ${handleHtml}
          <div class="item-content">
            <input type="checkbox" class="checkbox" ${item.checked ? "checked" : ""}>
            <span class="item-text">${escapeHtml(item.text)}</span>
          </div>
          <button class="del-item-btn" title="Delete">✕</button>
        `;

        const contentDiv = row.querySelector(".item-content");
        const textSpan = row.querySelector(".item-text");

        contentDiv.addEventListener("click", (e) => {
          if (e.target.tagName === 'INPUT' && e.target.classList.contains('inline-edit-input')) return;
          toggleCheck(index);
        });

        let pressTimer = null;
        textSpan.addEventListener("dblclick", (e) => {
          e.stopPropagation();
          startInlineEdit(index, textSpan, contentDiv);
        });

        textSpan.addEventListener("touchstart", (e) => {
          pressTimer = setTimeout(() => {
            e.stopPropagation();
            startInlineEdit(index, textSpan, contentDiv);
          }, 600);
        }, { passive: true });

        textSpan.addEventListener("touchend", () => clearTimeout(pressTimer));
        textSpan.addEventListener("touchmove", () => clearTimeout(pressTimer));

        row.querySelector(".del-item-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          deleteItem(index);
        });

        if (!item.checked) {
          setupRowDragAndTouch(row);
          listContainer.appendChild(row);
        } else {
          completedContainer.appendChild(row);
        }
      });

      if (totalCount === 0) {
        listContainer.innerHTML = `<div class="empty-hint">NO TASKS FOUND.<br>ADD ONE ABOVE.</div>`;
      } else if (completedCount === totalCount) {
        listContainer.innerHTML = `<div class="empty-hint" style="color: var(--accent-orange); font-weight: bold;">★ ALL CLEARED! ★</div>`;
      }

      if (completedCount > 0) {
        completedSection.style.display = "block";
        document.getElementById("completed-title-count").textContent = `CLEARED (${completedCount})`;
      } else {
        completedSection.style.display = "none";
      }

      updateAccordionArrow();

      const allChecked = totalCount > 0 && completedCount === totalCount;

      const progressPercent = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);
      const fillBar = document.getElementById("progress-bar-fill");
      fillBar.style.width = `${progressPercent}%`;

      document.getElementById("progress-text").textContent = `${completedCount}/${totalCount} (${progressPercent}%)`;

      const catStreak = categoryStreaks[currentCategory] ? categoryStreaks[currentCategory].current : 0;
      const streakBadge = document.getElementById("streak-display");
      const streakText = document.getElementById("streak-text");
      streakText.textContent = `${catStreak} DAYS`;
      streakBadge.classList.toggle("zero", catStreak === 0);

      if (allChecked && !wasAllCompleted) {
        triggerPixelCrackers();
        SoundEngine.playAllClear();
        triggerHaptic([40, 60, 40]);
        updateStreakOnAllCompleted(currentCategory);
        const updatedCatStreak = categoryStreaks[currentCategory].current;
        streakText.textContent = `${updatedCatStreak} DAYS`;
        streakBadge.classList.remove("zero");

        streakBadge.classList.remove("pixel-pop");
        void streakBadge.offsetWidth;
        streakBadge.classList.add("pixel-pop");
      }
      wasAllCompleted = allChecked;

      saveData();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function startInlineEdit(index, textSpan, container) {
      triggerHaptic(20);
      const currentText = data[currentCategory][index].text;
      const input = document.createElement("input");
      input.type = "text";
      input.className = "inline-edit-input";
      input.value = currentText;

      const finalizeEdit = () => {
        const val = input.value.trim();
        if (val && val !== currentText) {
          data[currentCategory][index].text = val;
          saveData();
        }
        render();
      };

      input.addEventListener("blur", finalizeEdit);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          input.blur();
        } else if (e.key === "Escape") {
          input.value = currentText;
          input.blur();
        }
      });

      container.replaceChild(input, textSpan);
      input.focus();
      input.select();
    }

    function toggleCheck(index) {
      const willBeChecked = !data[currentCategory][index].checked;
      data[currentCategory][index].checked = willBeChecked;

      if (willBeChecked) {
        SoundEngine.playCheck();
        triggerHaptic(25);
      } else {
        SoundEngine.playUncheck();
        triggerHaptic([15, 30]);
      }

      render(index);
    }

    function addItem(e) {
      e.preventDefault();
      const input = document.getElementById("new-item-input");
      const val = input.value.trim();
      if (!val) return;

      triggerHaptic(20);
      if (!data[currentCategory]) data[currentCategory] = [];
      data[currentCategory].push({ text: val, checked: false });
      input.value = "";
      wasAllCompleted = false;
      render();
    }

    function deleteItem(index) {
      triggerHaptic(25);
      data[currentCategory].splice(index, 1);
      render();
    }

    function addNewCategory() {
      const name = prompt("Enter tab name:");
      if (!name) return;
      const cleanName = name.trim();
      if (!cleanName) return;

      if (data[cleanName]) {
        alert("Tab already exists.");
        currentCategory = cleanName;
      } else {
        data[cleanName] = [];
        currentCategory = cleanName;
      }
      wasAllCompleted = false;
      render();
    }

    function deleteCurrentCategory() {
      if (categories.length <= 1) {
        alert("Cannot delete the last remaining tab.");
        return;
      }
      const confirmDelete = confirm(`Delete "${currentCategory}"?`);
      if (confirmDelete) {
        delete data[currentCategory];
        delete categoryStreaks[currentCategory];
        currentCategory = Object.keys(data)[0];
        wasAllCompleted = false;
        render();
      }
    }

    /* Drag & Drop */
    let draggedRow = null;

    function setupRowDragAndTouch(row) {
      const handle = row.querySelector(".drag-handle");
      if (!handle) return;

      row.setAttribute("draggable", "true");
      row.addEventListener("dragstart", (e) => {
        draggedRow = row;
        row.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });
      row.addEventListener("dragend", () => {
        if (draggedRow) draggedRow.classList.remove("dragging");
        draggedRow = null;
      });

      handle.addEventListener("touchstart", (e) => {
        draggedRow = row;
        row.classList.add("dragging");
        triggerHaptic(20);
      }, { passive: true });

      handle.addEventListener("touchmove", (e) => {
        if (!draggedRow) return;
        const touchY = e.touches[0].clientY;
        const targetElement = document.elementFromPoint(e.touches[0].clientX, touchY);
        const targetRow = targetElement ? targetElement.closest("#item-list .item-row") : null;

        if (targetRow && targetRow !== draggedRow) {
          const list = document.getElementById("item-list");
          const rect = targetRow.getBoundingClientRect();
          const next = (touchY - rect.top) / (rect.bottom - rect.top) > 0.5;
          list.insertBefore(draggedRow, next ? targetRow.nextSibling : targetRow);
        }
      }, { passive: true });

      handle.addEventListener("touchend", () => {
        if (draggedRow) {
          draggedRow.classList.remove("dragging");
          finalizeReorder();
          draggedRow = null;
        }
      });
    }

    const listElement = document.getElementById("item-list");
    listElement.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (!draggedRow) return;
      const afterElement = getDragAfterElement(listElement, e.clientY);
      if (afterElement == null) {
        listElement.appendChild(draggedRow);
      } else {
        listElement.insertBefore(draggedRow, afterElement);
      }
    });

    listElement.addEventListener("drop", (e) => {
      e.preventDefault();
      finalizeReorder();
    });

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll(".item-row:not(.dragging)")];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function finalizeReorder() {
      triggerHaptic(20);
      const activeRows = [...document.querySelectorAll("#item-list .item-row")];
      const completedRows = [...document.querySelectorAll("#completed-items-container .item-row")];
      
      const newItems = [];
      const currentItems = data[currentCategory] || [];
      
      activeRows.forEach(r => {
        const idx = parseInt(r.dataset.index, 10);
        if (!isNaN(idx) && currentItems[idx]) {
          newItems.push(currentItems[idx]);
        }
      });
      
      completedRows.forEach(r => {
        const idx = parseInt(r.dataset.index, 10);
        if (!isNaN(idx) && currentItems[idx]) {
          newItems.push(currentItems[idx]);
        }
      });

      data[currentCategory] = newItems;
      render();
    }

    /* Pixel Confetti Engine */
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    let particles = [];
    let animationFrameId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function createPixelParticle(x, y, angleBase, baseSpeed) {
      const colors = ["#ff5400", "#ffd166", "#22c55e", "#0ea5e9", "#ffffff", "#3d4f58"];
      const angle = angleBase + (Math.random() - 0.5) * 0.75;
      const speed = Math.random() * (baseSpeed * 0.5) + baseSpeed;

      return {
        x: Math.floor(x),
        y: Math.floor(y),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: 0.42,
        drag: 0.988,
        size: Math.floor(Math.random() * 3 + 6),
        color: colors[Math.floor(Math.random() * colors.length)],
        opacity: 1
      };
    }

    function triggerPixelCrackers() {
      const bottomY = canvas.height + 10;
      const countSide = 40;
      const countCenter = 35;

      for (let i = 0; i < countSide; i++) {
        particles.push(createPixelParticle(canvas.width * 0.1, bottomY, -Math.PI * 0.32, 21));
      }
      for (let i = 0; i < countSide; i++) {
        particles.push(createPixelParticle(canvas.width * 0.9, bottomY, -Math.PI * 0.68, 21));
      }
      for (let i = 0; i < countCenter; i++) {
        particles.push(createPixelParticle(canvas.width * 0.5, bottomY, -Math.PI * 0.5, 23.5));
      }

      if (!animationFrameId) {
        updatePixelConfetti();
      }
    }

    function updatePixelConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.vy += p.gravity;
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.x += p.vx;
        p.y += p.vy;

        if (p.vy > 2.0) {
          p.opacity -= 0.035;
        }

        if (p.opacity <= 0 || p.y > canvas.height + 40) {
          particles.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
      }
      ctx.globalAlpha = 1.0;

      if (particles.length > 0) {
        animationFrameId = requestAnimationFrame(updatePixelConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        animationFrameId = null;
      }
    }

    /* 定期チェック（オートリセット・通知） */
    setInterval(() => {
      checkDailyAutoReset();
      checkDailyNotification();
    }, 30000);

    window.addEventListener("focus", () => {
      checkDailyAutoReset();
      checkDailyNotification();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        checkDailyAutoReset();
        checkDailyNotification();
      }
    });

    checkDailyAutoReset();
    render();
  </script>
</body>
</html>
